fn draw_map_graphic(c Canvas&, cx f32, cy f32, span_w f32, span_h f32, pal Palette, shade f32, title_px f32) {
	let road = shade_color(pal.panel2, shade);
	let acc = shade_color(pal.acc, shade);
	let top f32 = cy - span_h * 0.28;
	let bottom f32 = cy + span_h * 0.28;
	for i in 5 {
		let k f32 = (i as f32) - 2.0;
		draw_line(c, cx + k * span_w * 0.07, top, cx + k * span_w * 0.21, bottom, 1.5, road);
	}
	let s f32 = min(span_w, span_h) * 0.14;
	let half_w f32 = max(s * 0.12, 2.0);
	draw_line(c, cx, cy - s, cx - s * 0.7, cy + s * 0.7, half_w, acc);
	draw_line(c, cx, cy - s, cx + s * 0.7, cy + s * 0.7, half_w, acc);
	draw_line(c, cx - s * 0.7, cy + s * 0.7, cx, cy + s * 0.3, half_w, acc);
	draw_line(c, cx + s * 0.7, cy + s * 0.7, cx, cy + s * 0.3, half_w, acc);
	draw_label(c, "AMNI-MAP 3D", cx, cy - span_h * 0.38, span_w, title_px, shade_color(pal.ink, shade));
	var heading byte[>..] = [];
	dot_label(heading, "HEADING UP", "0.4 MI");
	draw_label(c, heading[..], cx, cy + span_h * 0.38, span_w, title_px * 0.75, shade_color(pal.soft, shade));
}
fn draw_media_content(c Canvas&, sr Rect, pal Palette, shade f32, ts TypeScale) {
	let cx f32 = sr.x + sr.w * 0.5;
	let acc = shade_color(pal.acc, shade);
	let ink = shade_color(pal.ink, shade);
	let face = shade_color(pal.panel2, shade);
	let rim = shade_color(pal.line2, shade);
	let r f32 = clamp(min(sr.w * 0.22, sr.h * 0.16), 24.0, 56.0);
	let puck_y f32 = sr.y + sr.h * 0.17;
	fill_circle_pod(c, cx, puck_y, r, face, rim, 2.0, false);
	fill_circle_pod(c, cx, puck_y, r * 0.5, face, acc, 2.5, false);
	draw_label(c, "SPOTIFY", cx, sr.y + sr.h * 0.41, sr.w, ts.meta_px, acc);
	draw_label(c, "NIGHT DRIVE", cx, sr.y + sr.h * 0.53, sr.w, ts.title_px, ink);
	let bw f32 = min(sr.w * 0.78, 280.0);
	let bar_y f32 = sr.y + sr.h * 0.63;
	fill_round_rect(c, cx - bw * 0.5, bar_y, bw, 6.0, 3.0, face, face, 0.0);
	fill_round_rect(c, cx - bw * 0.5, bar_y, bw * 0.58, 6.0, 3.0, acc, acc, 0.0);
	let tw f32 = max(min(sr.w - 12.0, 260.0), 0.0);
	let th f32 = min(clamp(sr.h * 0.17, 44.0, 58.0), sr.h);
	let ty f32 = max(sr.y + sr.h - th - 4.0, sr.y);
	let mid f32 = ty + th * 0.5;
	fill_round_rect(c, cx - tw * 0.5, ty, tw, th, th * 0.5, face, rim, 1.0);
	let pw f32 = tw * 0.4;
	let ph f32 = max(th - 10.0, 0.0);
	fill_round_rect(c, cx - pw * 0.5, mid - ph * 0.5, pw, ph, ph * 0.5, acc, acc, 1.0);
	let on u32 = if pal.light { 0xFFFFFFFF } else { 0xFF05070A };
	let text_px f32 = min(ts.meta_px, th * 0.5);
	draw_label(c, "<<", cx - tw * 0.34, mid, tw * 0.22, text_px, ink);
	draw_label(c, "PLAY", cx, mid, pw - 8.0, text_px, shade_color(on, shade));
	draw_label(c, "PLAY", cx + 1.0, mid, pw - 8.0, text_px, shade_color(on, shade));
	draw_label(c, ">>", cx + tw * 0.34, mid, tw * 0.22, text_px, ink);
}
fn draw_speed_content(c Canvas&, r Rect, pal Palette, ts TypeScale, speed_mph i32, stacked bool) {
	let cx f32 = if stacked { r.x + r.w * 0.42 } else { r.x + r.w * 0.5 };
	let cy f32 = r.y + r.h * 0.5;
	var number byte[>..] = [];
	if stacked {
		let big f32 = ts.telemetry_px * 1.2;
		let small f32 = big * 0.5;
		format(number, speed_mph);
		draw_label(c, number[..], cx, cy - small * 0.5, r.w, big, pal.ink);
		draw_label(c, "MPH", cx, cy + big * 0.5, r.w, small, pal.acc);
	} else {
		format(number, speed_mph, " MPH");
		let want f32 = min(ts.telemetry_px * 0.7, r.h * 0.7);
		draw_label(c, number[..], cx, cy, r.w - 12.0, want, pal.ink);
	}
}
fn draw_weather_content(c Canvas&, r Rect, pal Palette, ts TypeScale, temp_f i32) {
	let cy f32 = r.y + r.h * 0.5;
	var temp byte[>..] = [];
	format(temp, temp_f, "F");
	let sun f32 = min(r.h * 0.32, r.w * 0.16);
	let gap f32 = sun * 0.5;
	let want f32 = min(ts.telemetry_px * 0.7, r.h * 0.7);
	let px_h = fit_px(temp[..], r.w - sun * 2.0 - gap - 8.0, want);
	let text_w f32 = measure_ttf(temp[..], px_h);
	let start f32 = r.x + max((r.w - (sun * 2.0 + gap + text_w)) * 0.5, 0.0);
	draw_sun_icon(c, start + sun, cy, sun, pal.gold);
	draw_text_ttf(c, temp[..], start + sun * 2.0 + gap, cy, px_h, pal.ink, false);
}
fn draw_apps_content(c Canvas&, r Rect, pal Palette, ts TypeScale) {
	draw_label(c, "APPS", r.x + r.w * 0.5, r.y + r.h * 0.5, r.w - 12.0, min(ts.button_px, r.h * 0.7), pal.ink);
}
fn draw_clock_content(c Canvas&, r Rect, pal Palette, ts TypeScale) {
	draw_label(c, "11:45 PM", r.x + r.w * 0.5, r.y + r.h * 0.5, r.w - 12.0, min(ts.button_px, r.h * 0.7), pal.soft);
}
fn draw_medallions(c Canvas&, sr Rect, pal Palette, shade f32, ts TypeScale) {
	draw_label(c, "VOICE & APPS", sr.x + sr.w * 0.5, sr.y + sr.h * 0.18, sr.w, ts.title_px, shade_color(pal.ink, shade));
	let slot f32 = sr.w * 0.25;
	let dot f32 = min(slot * 0.32, sr.h * 0.2);
	let dot_y f32 = sr.y + sr.h * 0.54;
	for i in 4 {
		let mx f32 = sr.x + slot * ((i as f32) + 0.5);
		let tint u32 = match i {
			0 => pal.acc,
			1 => 0xFF1DB954,
			2 => 0xFF3B82F6,
			_ => pal.gold,
		};
		let name const byte[:] = match i {
			0 => "MAPS",
			1 => "MUSIC",
			2 => "PHONE",
			_ => "VOICE",
		};
		fill_circle_pod(c, mx, dot_y, dot, shade_color(tint, shade), shade_color(pal.line2, shade), 2.0, false);
		draw_label(c, name, mx, sr.y + sr.h * 0.85, slot - 4.0, ts.meta_px, shade_color(pal.soft, shade));
	}
}
fn draw_telemetry_content(c Canvas&, sr Rect, pal Palette, shade f32, ts TypeScale, speed_mph i32, temp_f i32) {
	draw_label(c, "VEHICLE TELEMETRY", sr.x + sr.w * 0.5, sr.y + sr.h * 0.2, sr.w, ts.title_px, shade_color(pal.ink, shade));
	var speed byte[>..] = [];
	format(speed, speed_mph, " MPH");
	var temp byte[>..] = [];
	format(temp, temp_f, " F");
	let big f32 = min(ts.telemetry_px, sr.h * 0.35);
	let gy f32 = sr.y + sr.h * 0.62;
	let ink = shade_color(pal.ink, shade);
	draw_label(c, speed[..], sr.x + sr.w * 0.28, gy, sr.w * 0.44, big, ink);
	draw_label(c, speed[..], sr.x + sr.w * 0.28 + 1.0, gy, sr.w * 0.44, big, ink);
	draw_label(c, temp[..], sr.x + sr.w * 0.72, gy, sr.w * 0.44, big, shade_color(pal.acc, shade));
}
fn draw_roller(c Canvas&, x f32, y f32, h f32, shift f32, pal Palette) {
	fill_round_rect(c, x, y, 18.0, h, 9.0, pal.panel2, pal.line2, 1.5);
	var ty f32 = y + 10.0 + shift;
	while ty < y + h - 8.0 {
		draw_line(c, x + 3.0, ty, x + 15.0, ty, 0.8, pal.dim);
		ty += 12.0;
	}
}
fn draw_drum_3d(c Canvas&, stage Rect, pal Palette, ts TypeScale, roll_deg f32, speed_mph i32, temp_f i32) {
	fill_round_rect(c, stage.x, stage.y, stage.w, stage.h, 26.0, shade_color(pal.bg, 0.7), pal.line2, 2.0);
	let collar_h f32 = stage.h * 0.84;
	let collar_y f32 = stage.y + (stage.h - collar_h) * 0.5;
	let shift f32 = (sin(roll_deg) as f32) * 6.0;
	draw_roller(c, stage.x + 3.0, collar_y, collar_h, shift, pal);
	draw_roller(c, stage.x + stage.w - 21.0, collar_y, collar_h, shift, pal);
	var faces DrumFace[>..] = [];
	for i in 4 {
		let face = drum_project_face(i as i32, roll_deg, stage.x + 24.0, stage.y + 10.0, stage.w - 48.0, stage.h - 20.0);
		if face.visible { faces.push(face); }
	}
	sort(faces) { a, b => a.z_depth > b.z_depth };
	let cx f32 = stage.x + stage.w * 0.5;
	var active i32 = 0;
	var nearest f32 = 360.0;
	for f in faces {
		if abs(f.rel_deg) < nearest {
			nearest = abs(f.rel_deg);
			active = f.app_idx;
		}
		let fill = shade_color(pal.panel, f.shade);
		let border u32 = if abs(f.rel_deg) < 22.0 { shade_color(pal.acc, f.shade) } else { shade_color(pal.line2, f.shade) };
		let x f32 = cx - f.vis_w * 0.5;
		let y f32 = f.y_center - f.vis_h * 0.5;
		fill_round_rect(c, x, y, f.vis_w, f.vis_h, clamp(f.vis_h * 0.10, 12.0, 26.0), fill, border, 2.0);
		if f.vis_h >= 64.0 {
			let sr = make_rect(x + 14.0, y + 14.0, f.vis_w - 28.0, f.vis_h - 28.0);
			match f.app_idx {
				0 => draw_map_graphic(c, cx, sr.y + sr.h * 0.5, sr.w, sr.h, pal, f.shade, ts.title_px),
				1 => draw_media_content(c, sr, pal, f.shade, ts),
				2 => draw_medallions(c, sr, pal, f.shade, ts),
				_ => draw_telemetry_content(c, sr, pal, f.shade, ts, speed_mph, temp_f),
			}
		} else {
			var title byte[>..] = [];
			match f.app_idx {
				0 => title.append("AMNI-MAP 3D"),
				1 => dot_label(title, "SPOTIFY", "NIGHT DRIVE"),
				2 => title.append("VOICE & APPS"),
				_ => title.append("VEHICLE TELEMETRY"),
			}
			draw_label(c, title[..], cx, f.y_center, f.vis_w - 20.0, min(ts.meta_px, max(f.vis_h * 0.6, 8.0)), shade_color(pal.ink, f.shade));
		}
	}
	let x0 = low_bound(stage.x + 2.0);
	let x1 = high_bound(stage.x + stage.w - 5.0, c.w);
	let top = floor(stage.y) as i32;
	let bottom = floor(stage.y + stage.h) as i32;
	for row in 36 {
		let cov f32 = 1.0 - (row as f32) / 36.0;
		for ix in x0..x1 {
			blend_px(c, ix, top + (row as i32), pal.bg, cov);
			blend_px(c, ix, bottom - 1 - (row as i32), pal.bg, cov);
		}
	}
	let dot_x f32 = stage.x + stage.w - 30.0;
	let mid f32 = stage.y + stage.h * 0.5;
	for i in 4 {
		let tint u32 = if (i as i32) == active { pal.acc } else { pal.dim };
		fill_circle_pod(c, dot_x, mid + ((i as f32) - 1.5) * 18.0, 4.0, tint, tint, 0.0, false);
	}
}
fn draw_cockpit_at(w i32, h i32, preset_key const byte[:], layout_id i32, dock_mode i32, speed_mph i32, temp_f i32, active_btn i32, drum_roll_deg f32) Canvas {
	let pal = build_palette(preset_key, 0, false);
	let ts = car_type_scale(w as f32, h as f32, 1.0);
	let plan = compute_cockpit(w as f32, h as f32, ts.min_hit_px, ts.gutter_px, ts.pad_px, layout_id, dock_mode, false);
	var c = new_canvas(w, h, pal.bg);
	let dock = plan.dock_rect;
	fill_round_rect(c, dock.x, dock.y, dock.w, dock.h, 18.0, pal.panel, pal.line, 1.5);
	let on u32 = if pal.light { 0xFFFFFFFF } else { 0xFF05070A };
	for b in plan.buttons {
		let br = b.rect;
		let active = b.id == active_btn;
		let face u32 = if active { pal.acc } else { pal.panel2 };
		let ink u32 = if active { on } else { pal.ink };
		if b.id == 4 {
			let orb f32 = min(br.w, br.h) * 0.5;
			fill_round_rect(c, br.x, br.y, br.w, br.h, orb, face, pal.acc, 2.5);
		} else {
			let rim u32 = if active { pal.acc } else { pal.line };
			fill_round_rect(c, br.x, br.y, br.w, br.h, 14.0, face, rim, 1.5);
		}
		draw_text_ttf(c, button_label(b.id), br.x + br.w * 0.5, br.y + br.h * 0.5, ts.button_px * 0.85, ink, true);
	}
	for layer in 2 {
		for pod in plan.pods {
			let primary = pod.kind == 0 || pod.kind == 1 || pod.kind == 6 || (pod.shape >= 4 && pod.shape <= 6);
			if primary != (layer == 0) { continue; }
			let stroke u32 = if pod.kind == 0 { pal.acc } else { pal.line2 };
			let pr = pod.rect;
			if pod.kind == 6 {
				draw_drum_3d(c, pr, pal, ts, drum_roll_deg, speed_mph, temp_f);
				continue;
			}
			if !primary {
				fill_round_rect(c, pr.x, pr.y, pr.w, pr.h, min(pr.w, pr.h) * 0.5, pal.panel2, pal.line2, 1.4);
			} else if pod.shape == 1 {
				let ticks = pod.kind == 0;
				fill_circle_pod(c, pod.circle.cx, pod.circle.cy, pod.circle.r, pal.panel, stroke, 2.2, ticks);
			} else if pod.shape == 2 {
				fill_hex_pod(c, pr.x, pr.y, pr.w, pr.h, pod.chamfer, pal.panel, stroke, 2.0);
			} else if pod.shape == 3 {
				let body u32 = if pod.kind >= 2 { pal.panel2 } else { pal.panel };
				fill_round_rect(c, pr.x, pr.y, pr.w, pr.h, pod.chamfer, body, stroke, 1.6);
			} else if pod.shape >= 4 && pod.shape <= 6 {
				fill_crescent_pod(c, pr, pod.chamfer, pod.cutout, pal.panel, pal.line2, 2.0);
			} else {
				fill_round_rect(c, pr.x, pr.y, pr.w, pr.h, 22.0, pal.panel, stroke, 1.6);
			}
			let safe = pod.safe_rect;
			if pod.kind == 0 {
				draw_map_graphic(c, safe.x + safe.w * 0.5, safe.y + safe.h * 0.5, safe.w, safe.h, pal, 1.0, ts.title_px);
			} else if pod.kind == 1 {
				draw_media_content(c, safe, pal, 1.0, ts);
			} else if pod.kind == 2 {
				let stacked = pod.shape == 4;
				let area = if stacked { pr } else { safe };
				draw_speed_content(c, area, pal, ts, speed_mph, stacked);
			} else if pod.kind == 3 {
				draw_weather_content(c, safe, pal, ts, temp_f);
			} else if pod.kind == 4 {
				draw_apps_content(c, safe, pal, ts);
			} else if pod.kind == 5 {
				draw_clock_content(c, safe, pal, ts);
			}
		}
	}
	c
}
fn draw_cockpit(w i32, h i32, preset_key const byte[:], layout_id i32, dock_mode i32, speed_mph i32, temp_f i32, active_btn i32) Canvas {
	draw_cockpit_at(w, h, preset_key, layout_id, dock_mode, speed_mph, temp_f, active_btn, 0.0)
}
fn write_ppm(c Canvas&, path const byte[:]) {
	var out byte[>..] = [];
	format(out, "P6\n", c.w, " ", c.h, "\n255\n");
	let count int = (c.w as int) * (c.h as int);
	for i in count {
		out.push(c.px[i * 4]);
		out.push(c.px[i * 4 + 1]);
		out.push(c.px[i * 4 + 2]);
	}
	write_file(path, out[..]);
}
fn render_preview(path const byte[:], w i32, h i32, preset_key const byte[:], layout_id i32, dock_mode i32, speed_mph i32, temp_f i32, active_btn i32, drum_roll_deg f32) {
	var c = draw_cockpit_at(w, h, preset_key, layout_id, dock_mode, speed_mph, temp_f, active_btn, drum_roll_deg);
	write_ppm(c, path);
}
