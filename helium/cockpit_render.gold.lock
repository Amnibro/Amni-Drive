fn pack_rows(a u64, b u64, d u64, e u64, f u64, g u64, h u64) u64 {
	a | (b << 5) | (d << 10) | (e << 15) | (f << 20) | (g << 25) | (h << 30)
}
fn glyph_rows(ch byte) u64 {
	let u byte = if ch >= 'a' && ch <= 'z' { ch - 32 } else { ch };
	match u {
		'A' => pack_rows(14, 17, 17, 31, 17, 17, 17),
		'B' => pack_rows(30, 17, 17, 30, 17, 17, 30),
		'C' => pack_rows(14, 17, 16, 16, 16, 17, 14),
		'D' => pack_rows(30, 17, 17, 17, 17, 17, 30),
		'E' => pack_rows(31, 16, 16, 30, 16, 16, 31),
		'F' => pack_rows(31, 16, 16, 30, 16, 16, 16),
		'G' => pack_rows(14, 17, 16, 23, 17, 17, 15),
		'H' => pack_rows(17, 17, 17, 31, 17, 17, 17),
		'I' => pack_rows(14, 4, 4, 4, 4, 4, 14),
		'J' => pack_rows(7, 2, 2, 2, 2, 18, 12),
		'K' => pack_rows(17, 18, 20, 24, 20, 18, 17),
		'L' => pack_rows(16, 16, 16, 16, 16, 16, 31),
		'M' => pack_rows(17, 27, 21, 21, 17, 17, 17),
		'N' => pack_rows(17, 17, 25, 21, 19, 17, 17),
		'O' => pack_rows(14, 17, 17, 17, 17, 17, 14),
		'P' => pack_rows(30, 17, 17, 30, 16, 16, 16),
		'Q' => pack_rows(14, 17, 17, 17, 21, 18, 13),
		'R' => pack_rows(30, 17, 17, 30, 20, 18, 17),
		'S' => pack_rows(15, 16, 16, 14, 1, 1, 30),
		'T' => pack_rows(31, 4, 4, 4, 4, 4, 4),
		'U' => pack_rows(17, 17, 17, 17, 17, 17, 14),
		'V' => pack_rows(17, 17, 17, 17, 17, 10, 4),
		'W' => pack_rows(17, 17, 17, 21, 21, 21, 10),
		'X' => pack_rows(17, 17, 10, 4, 10, 17, 17),
		'Y' => pack_rows(17, 17, 10, 4, 4, 4, 4),
		'Z' => pack_rows(31, 1, 2, 4, 8, 16, 31),
		'0' => pack_rows(14, 17, 19, 21, 25, 17, 14),
		'1' => pack_rows(4, 12, 4, 4, 4, 4, 14),
		'2' => pack_rows(14, 17, 1, 2, 4, 8, 31),
		'3' => pack_rows(31, 2, 4, 2, 1, 17, 14),
		'4' => pack_rows(2, 6, 10, 18, 31, 2, 2),
		'5' => pack_rows(31, 16, 30, 1, 1, 17, 14),
		'6' => pack_rows(6, 8, 16, 30, 17, 17, 14),
		'7' => pack_rows(31, 1, 2, 4, 8, 8, 8),
		'8' => pack_rows(14, 17, 17, 14, 17, 17, 14),
		'9' => pack_rows(14, 17, 17, 15, 1, 2, 12),
		' ' => pack_rows(0, 0, 0, 0, 0, 0, 0),
		':' => pack_rows(0, 4, 4, 0, 4, 4, 0),
		176 => pack_rows(12, 18, 18, 12, 0, 0, 0),
		'.' => pack_rows(0, 0, 0, 0, 0, 12, 12),
		'-' => pack_rows(0, 0, 0, 31, 0, 0, 0),
		'/' => pack_rows(0, 1, 2, 4, 8, 16, 0),
		'+' => pack_rows(0, 4, 4, 31, 4, 4, 0),
		'<' => pack_rows(2, 4, 8, 16, 8, 4, 2),
		'>' => pack_rows(8, 4, 2, 1, 2, 4, 8),
		_ => pack_rows(0, 0, 0, 0, 0, 0, 0),
	}
}
fn draw_text(c Canvas&, text const byte[:], x f32, y f32, scale i32, col u32, center_x bool) {
	let s i32 = max(scale, 1);
	let total int = text.len * 6 * (s as int) - (s as int);
	let start f32 = if center_x { x - (total as f32) * 0.5 } else { x };
	let left = floor(start) as i32;
	let top = floor(y) as i32;
	var pen i32 = left;
	for ch in text {
		let glyph = glyph_rows(ch);
		for row in 7 {
			for column in 5 {
				let shift = (row * 5 + 4 - column) as u64;
				if ((glyph >> shift) & 1) != 0 {
					let bx i32 = pen + (column as i32) * s;
					let by i32 = top + (row as i32) * s;
					for oy in 0..s {
						for ox in 0..s {
							blend_px(c, bx + ox, by + oy, col, 1.0);
						}
					}
				}
			}
		}
		pen += 6 * s;
	}
}
fn bitmap_scale(px_h f32) i32 {
	max(floor(px_h / 9.0) as i32, 1)
}
fn measure_ttf(text const byte[:], px_h f32) f32 {
	if !FONT_READY { return (text.len * 6 * (bitmap_scale(px_h) as int)) as f32; }
	let scale = ttf::scale_for(FONT_INFO, px_h);
	var total f32 = 0.0;
	for ch in text {
		let g = ttf::glyph_index(FONT_INFO, ch as int);
		let hm = ttf::hmetrics(FONT_INFO, g);
		total += (hm.x as f32) * scale;
	}
	total
}
fn draw_text_ttf(c Canvas&, text const byte[:], x f32, y f32, px_h f32, col u32, center_x bool) {
	if !FONT_READY {
		let s = bitmap_scale(px_h);
		draw_text(c, text, x, y - (s as f32) * 3.5, s, col, center_x);
		return;
	}
	let scale = ttf::scale_for(FONT_INFO, px_h);
	let vm = ttf::vmetrics(FONT_INFO);
	let ascent f32 = (vm.x as f32) * scale;
	let descent f32 = (vm.y as f32) * scale;
	let base_y f32 = y + (ascent + descent) * 0.5;
	var pen_x f32 = x;
	if center_x { pen_x -= measure_ttf(text, px_h) * 0.5; }
	for ch in text {
		let g = ttf::glyph_index(FONT_INFO, ch as int);
		let hm = ttf::hmetrics(FONT_INFO, g);
		let b = ttf::bbox(FONT_INFO, g, scale, scale, 0.0, 0.0);
		let gw = b.x1 - b.x0;
		let gh = b.y1 - b.y0;
		if gw > 0 && gh > 0 {
			var gbuf byte[>..] = [];
			gbuf.resize(gw * gh, 0);
			ttf::glyph_bitmap(FONT_INFO, gbuf, 0, gw, gh, gw, scale, scale, g);
			let left i32 = (floor(pen_x) as i32) + (b.x0 as i32);
			let top i32 = (floor(base_y) as i32) + (b.y0 as i32);
			for gy in 0..gh {
				for gx in 0..gw {
					let alpha = gbuf[gy * gw + gx];
					if alpha != 0 {
						blend_px(c, left + (gx as i32), top + (gy as i32), col, (alpha as f32) / 255.0);
					}
				}
			}
		}
		pen_x += (hm.x as f32) * scale;
	}
}
fn fit_px(text const byte[:], width f32, want f32) f32 {
	let wide f32 = measure_ttf(text, want);
	if wide > width && wide > 0.0 { want * max(width, 1.0) / wide } else { want }
}
fn draw_label(c Canvas&, text const byte[:], cx f32, cy f32, width f32, px_h f32, col u32) {
	draw_text_ttf(c, text, cx, cy, fit_px(text, width, px_h), col, true);
}
