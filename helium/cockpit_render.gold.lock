		4 => "VOICE",
		5 => "VIEW",
		6 => "SET",
		_ => "",
	}
}
fn draw_map_content(c Canvas&, r Rect, pal Palette) {
	let cx f32 = r.x + r.w * 0.5;
	let cy f32 = r.y + r.h * 0.5;
	for i in 1..4 {
		let f f32 = (i as f32) * 0.25;
		draw_line(c, r.x + r.w * f, r.y + r.h * 0.18, r.x + r.w * f, r.y + r.h * 0.82, 1.5, pal.panel2);
		draw_line(c, r.x + r.w * 0.08, r.y + r.h * f, r.x + r.w * 0.92, r.y + r.h * f, 1.5, pal.panel2);
	}
	let s f32 = min(r.w, r.h) * 0.18;
	let half_w f32 = max(s * 0.12, 2.0);
	draw_line(c, cx, cy - s, cx - s * 0.7, cy + s * 0.7, half_w, pal.acc);
	draw_line(c, cx, cy - s, cx + s * 0.7, cy + s * 0.7, half_w, pal.acc);
	draw_line(c, cx - s * 0.7, cy + s * 0.7, cx, cy + s * 0.3, half_w, pal.acc);
	draw_line(c, cx + s * 0.7, cy + s * 0.7, cx, cy + s * 0.3, half_w, pal.acc);
	draw_label(c, "AMNI-MAP 3D", cx, r.y + r.h * 0.12, r.w, 3, pal.ink);
	draw_label(c, "HEADING UP", cx, r.y + r.h * 0.88, r.w, 2, pal.soft);
}
fn draw_media_content(c Canvas&, r Rect, pal Palette) {
	let cx f32 = r.x + r.w * 0.5;
	let badge f32 = min(r.w, r.h) * 0.18;
	fill_circle_pod(c, cx, r.y + r.h * 0.22, badge, pal.panel2, pal.acc, 2.5, false);
	fill_circle_pod(c, cx, r.y + r.h * 0.22, badge * 0.25, pal.acc, pal.acc, 1.0, false);
	draw_label(c, "SPOTIFY", cx, r.y + r.h * 0.49, r.w, 2, pal.soft);
	draw_label(c, "NIGHT DRIVE", cx, r.y + r.h * 0.63, r.w, 3, pal.ink);
	let s = fit_scale(12, r.w, 3);
	let sf f32 = s as f32;
	let bar_h f32 = max(r.h * 0.2, sf * 11.0);
	let bar_y f32 = r.y + r.h - bar_h;
	let mid f32 = bar_y + bar_h * 0.5;
	fill_round_rect(c, r.x, bar_y, r.w, bar_h, bar_h * 0.5, pal.panel2, pal.line, 1.0);
	fill_round_rect(c, cx - sf * 15.0, mid - sf * 5.5, sf * 30.0, sf * 11.0, sf * 5.5, pal.acc, pal.acc, 1.0);
	let on u32 = if pal.light { 0xFFFFFFFF } else { 0xFF05070A };
	draw_text(c, "<<  PLAY  >>", cx, mid - sf * 3.5, s, pal.ink, true);
	draw_text(c, "PLAY", cx, mid - sf * 3.5, s, on, true);
}
fn draw_speed_content(c Canvas&, r Rect, pal Palette, ts TypeScale, speed_mph i32, stacked bool) {
	let cx f32 = if stacked { r.x + r.w * 0.42 } else { r.x + r.w * 0.5 };
	let cy f32 = r.y + r.h * 0.5;
	var number byte[>..] = [];
	if stacked {
		let big i32 = max(4, floor(ts.telemetry_px / 9.0) as i32);
		let small i32 = max(2, big / 2);
		format(number, speed_mph);
		let big_h f32 = (big * 7) as f32;
		let small_h f32 = (small * 7) as f32;
		let gap f32 = (big * 2) as f32;
		let top f32 = cy - (big_h + gap + small_h) * 0.5;
		draw_text(c, number[..], cx, top, big, pal.ink, true);
		draw_text(c, number[..], cx + 1.0, top, big, pal.ink, true);
		draw_text(c, "MPH", cx, top + big_h + gap, small, pal.acc, true);
	} else {
		format(number, speed_mph, " MPH");
		let want i32 = max(3, floor(ts.telemetry_px / 12.0) as i32);
		draw_label(c, number[..], cx, cy, r.w, want, pal.ink);
		draw_label(c, number[..], cx + 1.0, cy, r.w, want, pal.ink);
	}
}
fn draw_weather_content(c Canvas&, r Rect, pal Palette, ts TypeScale, temp_f i32) {
	let cy f32 = r.y + r.h * 0.5;
	var temp byte[>..] = [];
	format(temp, temp_f, "F");
	let want i32 = max(3, floor(ts.telemetry_px / 12.0) as i32);
	let sun f32 = min(r.h * 0.32, r.w * 0.16);
	let gap f32 = sun * 0.5;
	let s = fit_scale(temp.len, r.w - sun * 2.0 - gap, want);
	let text_w f32 = (temp.len * 6 * (s as int) - (s as int)) as f32;
	let start f32 = r.x + max((r.w - (sun * 2.0 + gap + text_w)) * 0.5, 0.0);
	draw_sun_icon(c, start + sun, cy, sun, pal.gold);
	draw_text(c, temp[..], start + sun * 2.0 + gap, cy - (s as f32) * 3.5, s, pal.ink, false);
}
