struct Canvas { w i32, h i32, px byte[>..] }
var FONT_INFO = ttf::Info { .. };
var FONT_READY = false;
fn load_font_bytes(data const byte[:]) bool {
	FONT_READY = false;
	FONT_INFO.d.clear();
	FONT_INFO.d.append(data);
	let fo = ttf::font_offset(FONT_INFO.d[..], 0);
	if fo < 0 { return false; }
	FONT_INFO.fo = fo;
	FONT_READY = ttf::init(FONT_INFO);
	FONT_READY
}
fn load_font_file(path const byte[:]) bool {
	var data byte[>..] = [];
	if !read_file(path, data) { return false; }
	load_font_bytes(data[..])
}
fn new_canvas(w i32, h i32, bg u32) Canvas {
	var c = Canvas { w: w, h: h, px: [] };
	let count int = (w as int) * (h as int);
	c.px.resize(count * 4, 0);
	let r = ((bg >> 16) & 255) as byte;
	let g = ((bg >> 8) & 255) as byte;
	let b = (bg & 255) as byte;
	let a = ((bg >> 24) & 255) as byte;
	for i in count {
		c.px[i * 4] = r;
		c.px[i * 4 + 1] = g;
		c.px[i * 4 + 2] = b;
		c.px[i * 4 + 3] = a;
	}
	c
}
fn shade_part(v u32, k f32) u32 {
	let n = floor(((v & 255) as f32) * k + 0.5) as int;
	clamp(n, 0, 255) as u32
}
fn shade_color(col u32, factor f32) u32 {
	let k f32 = clamp(factor, 0.0, 1.4);
	let r = shade_part(col >> 16, k);
	let g = shade_part(col >> 8, k);
	let b = shade_part(col, k);
	(col & 0xFF000000) | (r << 16) | (g << 8) | b
}
fn mix_channel(src u32, dst byte, a f32) byte {
	let s f32 = (src & 255) as f32;
	let d f32 = dst as f32;
	let v f32 = s * a + d * (1.0 - a) + 0.5;
	let n = floor(v) as int;
	clamp(n, 0, 255) as byte
}
fn blend_px(c Canvas&, x i32, y i32, col u32, cov f32) {
	if x < 0 || y < 0 || x >= c.w || y >= c.h || cov <= 0.0 { return; }
	let a f32 = (((col >> 24) & 255) as f32 / 255.0) * clamp(cov, 0.0, 1.0);
	let i int = ((y as int) * (c.w as int) + (x as int)) * 4;
	c.px[i] = mix_channel(col >> 16, c.px[i], a);
	c.px[i + 1] = mix_channel(col >> 8, c.px[i + 1], a);
	c.px[i + 2] = mix_channel(col, c.px[i + 2], a);
	c.px[i + 3] = 255;
}
fn shade_sdf(c Canvas&, x i32, y i32, d f32, fill u32, stroke u32, stroke_w f32) {
	if d >= 0.5 { return; }
	let cov f32 = clamp(0.5 - d, 0.0, 1.0);
	blend_px(c, x, y, fill, cov);
	if stroke_w > 0.0 && ((stroke >> 24) & 255) != 0 && d >= 0.0 - stroke_w - 0.5 {
		let inner f32 = clamp(d + stroke_w + 0.5, 0.0, 1.0);
		blend_px(c, x, y, stroke, cov * inner);
	}
}
fn low_bound(v f32) i32 {
	max(floor(v - 2.0) as i32, 0)
}
fn high_bound(v f32, limit i32) i32 {
	min(floor(v + 3.0) as i32, limit)
}
fn sdf_round_rect(px f32, py f32, x f32, y f32, w f32, h f32, radius f32) f32 {
	let half_min f32 = min(w, h) * 0.5;
	let rad f32 = min(radius, half_min);
	let hw f32 = w * 0.5;
	let hh f32 = h * 0.5;
	let qx f32 = abs(px - (x + hw)) - (hw - rad);
	let qy f32 = abs(py - (y + hh)) - (hh - rad);
	let ox f32 = max(qx, 0.0);
	let oy f32 = max(qy, 0.0);
	let outside f32 = sqrt(ox * ox + oy * oy) as f32;
	let inside f32 = min(max(qx, qy), 0.0);
	outside + inside - rad
}
fn fill_round_rect(c Canvas&, x f32, y f32, w f32, h f32, radius f32, fill u32, stroke u32, stroke_w f32) {
	let half_min f32 = min(w, h) * 0.5;
	let rad f32 = min(radius, half_min);
	let hw f32 = w * 0.5;
	let hh f32 = h * 0.5;
	let cx f32 = x + hw;
	let cy f32 = y + hh;
	let x0 = low_bound(x);
	let x1 = high_bound(x + w, c.w);
	let y0 = low_bound(y);
	let y1 = high_bound(y + h, c.h);
	for iy in y0..y1 {
		for ix in x0..x1 {
			let dx f32 = (ix as f32) + 0.5 - cx;
			let dy f32 = (iy as f32) + 0.5 - cy;
			let qx f32 = abs(dx) - (hw - rad);
			let qy f32 = abs(dy) - (hh - rad);
			let ox f32 = max(qx, 0.0);
			let oy f32 = max(qy, 0.0);
			let outside f32 = sqrt(ox * ox + oy * oy) as f32;
			let inside f32 = min(max(qx, qy), 0.0);
			let d f32 = outside + inside - rad;
			shade_sdf(c, ix, iy, d, fill, stroke, stroke_w);
		}
	}
}
fn fill_crescent_pod(c Canvas&, r Rect, radius f32, cutout Circle, fill u32, stroke u32, stroke_w f32) {
	let x0 = low_bound(r.x);
	let x1 = high_bound(r.x + r.w, c.w);
	let y0 = low_bound(r.y);
	let y1 = high_bound(r.y + r.h, c.h);
	for iy in y0..y1 {
		for ix in x0..x1 {
			let px f32 = (ix as f32) + 0.5;
			let py f32 = (iy as f32) + 0.5;
			let d_box f32 = sdf_round_rect(px, py, r.x, r.y, r.w, r.h, radius);
			var d f32 = d_box;
			if cutout.r > 0.0 {
				let dx f32 = px - cutout.cx;
				let dy f32 = py - cutout.cy;
				let d_hole f32 = cutout.r - (sqrt(dx * dx + dy * dy) as f32);
				d = max(d_box, d_hole);
			}
			shade_sdf(c, ix, iy, d, fill, stroke, stroke_w);
		}
	}
}
fn draw_line(c Canvas&, ax f32, ay f32, bx f32, by f32, half_w f32, col u32) {
	let lx = low_bound(min(ax, bx) - half_w);
	let hx = high_bound(max(ax, bx) + half_w, c.w);
	let ly = low_bound(min(ay, by) - half_w);
	let hy = high_bound(max(ay, by) + half_w, c.h);
	let vx f32 = bx - ax;
	let vy f32 = by - ay;
	let len2 f32 = max(vx * vx + vy * vy, 0.0001);
	for iy in ly..hy {
		for ix in lx..hx {
			let wx f32 = (ix as f32) + 0.5 - ax;
			let wy f32 = (iy as f32) + 0.5 - ay;
			let t f32 = clamp((wx * vx + wy * vy) / len2, 0.0, 1.0);
			let ex f32 = wx - vx * t;
			let ey f32 = wy - vy * t;
			let d f32 = (sqrt(ex * ex + ey * ey) as f32) - half_w;
			blend_px(c, ix, iy, col, clamp(0.5 - d, 0.0, 1.0));
		}
	}
}
fn fill_circle_pod(c Canvas&, cx f32, cy f32, r f32, fill u32, stroke u32, stroke_w f32, ticks bool) {
	let x0 = low_bound(cx - r);
	let x1 = high_bound(cx + r, c.w);
	let y0 = low_bound(cy - r);
	let y1 = high_bound(cy + r, c.h);
	for iy in y0..y1 {
		for ix in x0..x1 {
			let dx f32 = (ix as f32) + 0.5 - cx;
			let dy f32 = (iy as f32) + 0.5 - cy;
			let d f32 = (sqrt(dx * dx + dy * dy) as f32) - r;
			shade_sdf(c, ix, iy, d, fill, stroke, stroke_w);
		}
	}
	if ticks {
		for i in 36 {
			let ang f32 = (i as f32) * 0.17453293;
			let ux f32 = cos(ang) as f32;
			let uy f32 = sin(ang) as f32;
			let start f32 = if i % 9 == 0 { r - 16.0 } else { r - 10.0 };
			let stop f32 = r - 3.0;
			draw_line(c, cx + ux * start, cy + uy * start, cx + ux * stop, cy + uy * stop, 0.8, stroke);
		}
	}
}
fn fill_hex_pod(c Canvas&, x f32, y f32, w f32, h f32, cut f32, fill u32, stroke u32, stroke_w f32) {
	let hw f32 = w * 0.5;
	let hh f32 = h * 0.5;
	let cx f32 = x + hw;
	let cy f32 = y + hh;
	let x0 = low_bound(x);
	let x1 = high_bound(x + w, c.w);
	let y0 = low_bound(y);
	let y1 = high_bound(y + h, c.h);
	for iy in y0..y1 {
		for ix in x0..x1 {
			let dx f32 = (ix as f32) + 0.5 - cx;
			let dy f32 = (iy as f32) + 0.5 - cy;
			let adx f32 = abs(dx);
			let ady f32 = abs(dy);
			let box_d f32 = max(adx - hw, ady - hh);
			let cut_d f32 = (adx + ady - (hw + hh - cut)) * 0.70710678;
			let d f32 = max(box_d, cut_d);
			shade_sdf(c, ix, iy, d, fill, stroke, stroke_w);
		}
	}
}
fn draw_sun_icon(c Canvas&, cx f32, cy f32, r f32, col u32) {
