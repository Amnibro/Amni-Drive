	var header byte[>..] = [];
	encode_frame_header(3, FLAG_FIRST, payload.len as u16, payload.len as u32, header);
	var warm = 0;
	warm += bench_scrub(line, 100);
	warm += bench_geo_gate(1000);
	warm += bench_aap_codec(header[..], payload[..], 1000);
	warm += bench_layout_aaa(100);
	assert(warm != 0);
	let scrub_start = clock_ns();
	let scrub_sum = bench_scrub(line, 10000);
	let scrub_ms = (clock_ns() - scrub_start) / 1000000;
