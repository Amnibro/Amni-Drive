	print("BENCH geo_gate 1000000 ", geo_ms, " ", geo_sum);
	let aap_start = clock_ns();
	let aap_sum = bench_aap_codec(header[..], payload[..], 500000);
	let aap_ms = (clock_ns() - aap_start) / 1000000;
	print("BENCH aap_codec 500000 ", aap_ms, " ", aap_sum);
	let layout_start = clock_ns();
	let layout_sum = bench_layout_aaa(100000);
	let layout_ms = (clock_ns() - layout_start) / 1000000;
	print("BENCH layout_aaa 100000 ", layout_ms, " ", layout_sum);
